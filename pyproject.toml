[project]
name = "probability-coach"
version = "0.1.0"
description = "Агент-тренер по задачам, где интуиция ошибается в вероятностях"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-deepseek",
    "langchain-postgres",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "langchain-huggingface",
    "sentence-transformers",
    "langchain-text-splitters",
    "langsmith",
    "numpy",
    "matplotlib",
    "python-dotenv",
    "requests",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]
